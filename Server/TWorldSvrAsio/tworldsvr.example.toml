# World configuration inputs for Phase A; database setup/run belongs to B/C.
[server]
# DEF_WORLDPORT from Lib/Own/TNetLib/TNetLib/TNetDef.h. Matching this
# default means existing TMap/TLogin peer configs point at this
# listener without change.
port            = 3815

# Hard cap on concurrent peer sockets. Defense against pre-auth
# socket flood. Set 0 to disable (not recommended in production).
max_connections = 256

# Production World requires an explicit database and worker pool. Supply the
# connection through the private local configuration; do not commit credentials.
# Native social/mail/communication need066-069 and grants; war/event bootstrap still needs
# its complete native port. This example does not declare a runnable PG cluster.
[database]
backend = "postgresql"
connection_string = ""
pool_size = 4
worker_threads = 2

[health]
# Minimal HTTP /healthz endpoint. Same shape as the four shipped
# Asio daemons so the cluster healthcheck rules can reuse them.
port = 18087

[log]
level = "info"

# Native PG World paths require written migrations001-069, verified guild-level
# and059 server-message publication plus world-{social,mail,guild-level,message}
# runtime grants and soulmate-runtime-grants.sql. Communication needs verified
# TOPERATORTABLE via import_world_operators.py and communication-runtime-grants.sql.
# These tools/SQL are not executed in Phase A. Other World repositories
# remain an implementation dependency; this is not a complete PG cluster.
[native_world]
# Empty accepts ASCII only. Set a lossless ANSI profile only from client/data
# evidence; the backup Latin1 group names alone do not identify a client EXE.
client_text_encoding = ""
